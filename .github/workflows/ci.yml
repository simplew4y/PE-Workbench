name: Workspace checks
on:
  push:
    branches: [main, integration/monorepo]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run hydrate:model-data
      - run: npm run build:offline
      - run: npm run build:pe-ingest --workspace=@agegr/pi-web
      - run: npm run check
      - run: node --test scripts/monorepo.test.mjs scripts/sync-versions.test.mjs
      - working-directory: apps/web
        run: node --test lib/compaction-summary.test.mjs lib/pe-ingest/analysis-webpack.test.mjs components/ChatWindow.result-only.test.mjs
