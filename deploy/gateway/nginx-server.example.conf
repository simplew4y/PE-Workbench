# This UI currently expects to run at URL root. Give it a dedicated hostname;
# do not mount it below /pe_workbench without first adding Next.js basePath support.
server {
    listen 443 ssl;
    server_name pe-workbench.example.com;

    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/private.key;

    client_max_body_size 320m;

    location / {
        proxy_pass http://127.0.0.1:30141;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        add_header X-Accel-Buffering no always;
    }
}

